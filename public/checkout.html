<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e40000">
    <title>Checkout | Airtel Packages</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .checkout-card {
            background: white;
            width: 100%;
            max-width: 470px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 35px rgba(0,0,0,.08);
        }

        .brand {
            color: #e40000;
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        h2 {
            margin: 18px 0 8px;
        }

        .muted {
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }

        .summary {
            background: #fff5f5;
            padding: 18px;
            border-radius: 10px;
            margin: 22px 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 12px;
            font-size: 14px;
        }

        .total {
            border-top: 1px solid #ddd;
            padding-top: 13px;
            font-weight: bold;
            font-size: 17px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin: 18px 0 8px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #e40000;
            box-shadow: 0 0 0 3px rgba(228,0,0,.08);
        }

        .phone-row {
            display: grid;
            grid-template-columns: 145px 1fr;
            gap: 9px;
        }

        .pin-note {
            background: #fff8e8;
            border: 1px solid #f1dfb6;
            color: #765400;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 10px;
        }

        button {
            width: 100%;
            background: #e40000;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 24px;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .form-message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-message.success {
            display: block;
            background: #e9f8ed;
            color: #176b31;
        }

        .form-message.error {
            display: block;
            background: #fff0f0;
            color: #b00020;
        }

        @media(max-width: 390px) {
            .checkout-card {
                padding: 20px;
            }

            .phone-row {
                grid-template-columns: 125px 1fr;
            }
        }
    </style>
</head>

<body>

<main class="checkout-card">

    <div class="brand">AIRTEL</div>
    <p class="muted">Packages checkout</p>

    <h2>Complete your order</h2>
    <p class="muted">Enter your test mobile number and fictional classroom PIN.</p>

    <section class="summary">
        <div id="packageSummary">
            Loading package details...
        </div>
    </section>

    <form id="checkoutForm">

        <label for="country">Country</label>

        <select id="country" required>
            <option value="+235">🇹🇩 Chad (+235)</option>
            <option value="+243">🇨🇩 DR Congo (+243)</option>
            <option value="+242">🇨🇬 Congo Brazzaville (+242)</option>
            <option value="+241">🇬🇦 Gabon (+241)</option>
            <option value="+254" selected>🇰🇪 Kenya (+254)</option>
            <option value="+261">🇲🇬 Madagascar (+261)</option>
            <option value="+265">🇲🇼 Malawi (+265)</option>
            <option value="+227">🇳🇪 Niger (+227)</option>
            <option value="+234">🇳🇬 Nigeria (+234)</option>
            <option value="+250">🇷🇼 Rwanda (+250)</option>
            <option value="+248">🇸🇨 Seychelles (+248)</option>
            <option value="+255">🇹🇿 Tanzania (+255)</option>
            <option value="+256">🇺🇬 Uganda (+256)</option>
            <option value="+260">🇿🇲 Zambia (+260)</option>
        </select>

        <label for="phone">Mobile number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter mobile number"
            autocomplete="off"
            required
        >

        <label for="demoPin">Classroom demonstration PIN</label>

        <input
            type="password"
            id="demoPin"
            placeholder="Enter fictional 4-digit PIN"
            inputmode="numeric"
            pattern="[0-9]{4}"
            minlength="4"
            maxlength="4"
            autocomplete="off"
            required
        >

        <div class="pin-note">
            Classroom simulation only. Use fictional test numbers and
            fictional PINs. Never enter your real mobile-money PIN.
        </div>

        <button type="submit" id="continueButton" disabled>
            Continue to Checkout
        </button>

        <div id="checkoutMessage" class="form-message" role="status"></div>

    </form>

</main>

<script src="/checkout.js"></script>

</body>
</html>
